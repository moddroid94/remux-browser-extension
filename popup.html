<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>m3u8DL Sniffer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="title">
        <img src="icons/icon48.png" alt="logo" class="logo">
        <span>m3u8DL Sniffer</span>
      </div>
      <div class="status" id="status">
        <span class="status-dot"></span>
        <span class="status-text">Disconnected</span>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button id="btnRefresh" class="btn btn-small btn-secondary" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
        Refresh
      </button>
      <button id="btnClear" class="btn btn-small btn-secondary" title="Clear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Clear
      </button>
      <button id="btnSelectAll" class="btn btn-small btn-secondary" title="Select All">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Select All
      </button>
      <button id="btnTranslate" class="btn btn-small btn-secondary hide" title="Translate Title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span class="btn-label">Translate</span>
      </button>
      <div class="toolbar-right">
        <label class="proxy-toggle" title="Proxy">
          <input type="checkbox" id="proxyToggle">
          <span class="toggle-label">Proxy</span>
        </label>
      </div>
      <span class="resource-count" id="resourceCount">0 resources</span>
    </div>

    <!-- Resource List -->
    <div class="resource-list" id="resourceList">
      <div class="empty-state" id="emptyState">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        <p>No media detected</p>
        <p class="hint">Please play a video and refresh</p>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="footer">
      <div class="selected-info">
        Selected: <span id="selectedCount">0</span>
      </div>
      <button id="btnSend" class="btn btn-primary" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        <span class="btn-label">Send to Remote Downloader</span>
      </button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="lib/hls.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
